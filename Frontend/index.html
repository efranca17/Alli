<!DOCTYPE html>
<html lang="pt-br">

<head>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mancha de café</title>
</head>

<body>
<aside class="barra-lateral">

<nav>
    <button aria-label="Início">
        <i data-lucide="house"></i>
    </button>

    <button aria-label="Conversas">
        <i data-lucide="message-circle"></i>
    </button>

    <button aria-label="Cardápio">
        <i data-lucide="coffee"></i>
    </button>

    <button aria-label="Configurações">
        <i data-lucide="settings"></i>
    </button>
</nav>

</aside>
<header>
<h1>Mancha de café</h1>

</header>
<main>
<section class="chat">
<div class="mensagem mensagem-alli">
<p>Olá! Seja bem-vindo à Mancha de Café.</p>
</div>

</section>

<div class="campo-mensagem">

    <input type="text" placeholder="Digite sua mensagem...">

    <button aria-label="Enviar">
        <i data-lucide="send"></i>
    </button>

</div>
</main>
<script>
    lucide.createIcons();
</script>
</body>

</html>
